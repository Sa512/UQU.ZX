<!doctype html>
<html lang="ar" dir="rtl">
<body style="margin:0;padding:0;background:#F5F6FB;font-family:Tahoma,Arial,sans-serif;color:#1E1B4B">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F6FB;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:16px;padding:32px;text-align:right" dir="rtl">
        <tr><td style="font-size:22px;font-weight:bold;color:#4F46E5;padding-bottom:8px">مذاكر</td></tr>
        <tr><td style="font-size:18px;font-weight:bold;padding-bottom:12px">رمز تأكيد حسابك</td></tr>
        <tr><td style="font-size:15px;line-height:1.7;color:#475069;padding-bottom:20px">اكتب هذا الرمز في التطبيق لتأكيد إيميلك الجامعي:</td></tr>
        <tr><td align="center" style="padding-bottom:20px">
          <div dir="ltr" style="display:inline-block;font-family:'Courier New',monospace;font-size:34px;font-weight:bold;letter-spacing:10px;background:#EEF2FF;color:#1E1B4B;border-radius:12px;padding:14px 24px">{{ .Token }}</div>

        <tr><td style="font-size:13px;line-height:1.7;color:#64748B">الرمز صالح لمدة 15 دقيقة ولمرة واحدة. إن لم تطلبه فتجاهل هذه الرسالة، ولن يُنشأ أي حساب.</td></tr>
        <tr><td style="font-size:12px;color:#94A3B8;padding-top:20px">لا تشارك هذا الرمز مع أحد، ولن نطلبه منك أبداً.</td></tr>
      </table>
    </td></tr>
  </table>
